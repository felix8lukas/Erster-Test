<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standort-Demo</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; }
    button { font-size: 1.2em; padding: 12px 24px; }
    #output { margin-top: 20px; color: #333; }
  </style>
</head>
<body>
  <h1>Willkommen</h1>
  <p>Klicken Sie auf den Button, um fortzufahren.</p>
  <button id="startBtn">Weiter</button>
  <div id="output"></div>

  <script>
    document.getElementById('startBtn').addEventListener('click', function () {
      if (!navigator.geolocation) {
        document.getElementById('output').textContent = 'Geolocation wird nicht unterstützt.';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function (position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          document.getElementById('output').textContent =
            'Standort: ' + lat.toFixed(5) + ', ' + lon.toFixed(5);
        },
        function (error) {
          document.getElementById('output').textContent =
            'Zugriff verweigert oder Fehler: ' + error.message;
        }
      );
    });
  </script>
</body>
</html>
